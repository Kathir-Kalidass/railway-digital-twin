services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto:/mosquitto/config:ro
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      PORT: 3001
      MQTT_URL: mqtt://mqtt:1883
      MQTT_BACKEND_USER: backend
      MQTT_BACKEND_PASS: ${MQTT_BACKEND_PASS:-backend-dev-pass}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-viewer-dev-pass}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-operator-dev-pass}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-dev-pass}
      DB_PATH: /app/data/railway.db
      # The camera/ML stub runs on the host (uvicorn :8001); route to it from inside the container.
      # host.docker.internal maps to the docker0 gateway (172.17.0.1), so uvicorn must NOT be
      # bound to loopback only: start it with --host 0.0.0.0 (or --host 172.17.0.1).
      ML_URL: http://host.docker.internal:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-data:/app/data
    ports:
      - "3001:3001"
    depends_on:
      - mqtt
  web:
    build: ./web
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend-data:
